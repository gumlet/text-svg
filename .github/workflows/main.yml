name: Test and deploy on NPM
on:
  push:
    tags:
    - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Test
      run: |    
        npm i
        npm run lint
        npm run typecheck
        npm test

  build_and_publish:
    runs-on: ubuntu-24.04
    needs: [test]

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
    - name: Build
      run: |
        npm i
        npm publish
